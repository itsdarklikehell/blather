[flake8]
max-line-length = 127
exclude = .git,__pycache__,build,dist
ignore = E203,W503

[tool:black]
line-length = 127
target-version = ['py39']

[tool:isort]
profile = "black"
line_length = 127

[tool:mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
